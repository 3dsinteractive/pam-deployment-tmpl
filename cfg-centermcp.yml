version: v1
configs:
- { name: "CENTREMCP_SECRET_KEY", alias: "CENTREMCP_SECRET_KEY", type: "s", required: false, sample: "", default: "" }
- { name: "CENTREMCP_SESSION_SECRET", alias: "CENTREMCP_SESSION_SECRET", type: "s", required: false, sample: "", default: "" }
- { name: "CENTREMCP_COOKIE_SECURE", alias: "CENTREMCP_COOKIE_SECURE", type: "b", required: false, sample: true, default: true }
- { name: "CENTREMCP_ADMIN_EMAIL", alias: "CENTREMCP_ADMIN_EMAIL", type: "s", required: false, sample: "admin@example.com", default: "" }
- { name: "CENTREMCP_ADMIN_PASSWORD", alias: "CENTREMCP_ADMIN_PASSWORD", type: "s", required: false, sample: "", default: "" }
- { name: "CENTREMCP_MCP_WORK_DIR", alias: "CENTREMCP_MCP_WORK_DIR", type: "s", required: false, sample: "/tmp/centermcp-repositories", default: "/tmp/centermcp-repositories" }
- { name: "CENTREMCP_DOCKER_HUB_USERNAME", alias: "CENTREMCP_DOCKER_HUB_USERNAME", type: "s", required: false, sample: "dockerhub-username", default: "" }
- { name: "CENTREMCP_DOCKER_HUB_TOKEN", alias: "CENTREMCP_DOCKER_HUB_TOKEN", type: "s", required: false, sample: "", default: "" }
- { name: "CENTREMCP_MCP_INGRESS_DOMAIN", alias: "CENTREMCP_MCP_INGRESS_DOMAIN", type: "s", required: false, sample: "centermcp.com", default: "centermcp.com" }
- { name: "CENTREMCP_MCP_INGRESS_CLASS", alias: "CENTREMCP_MCP_INGRESS_CLASS", type: "s", required: false, sample: "nginx", default: "nginx" }
- { name: "CENTREMCP_MCP_INGRESS_TLS_SECRET", alias: "CENTREMCP_MCP_INGRESS_TLS_SECRET", type: "s", required: false, sample: "tls-centermcp-com", default: "tls-centermcp-com" }
- { name: "CENTREMCP_MCP_CONTAINER_PORT", alias: "CENTREMCP_MCP_CONTAINER_PORT", type: "n", required: false, sample: 8000, default: 8000 }
- { name: "CENTREMCP_MCP_ENDPOINT_PATH", alias: "CENTREMCP_MCP_ENDPOINT_PATH", type: "s", required: false, sample: "/mcp", default: "/mcp" }
- { name: "CENTREMCP_MCP_PULL_SECRET", alias: "CENTREMCP_MCP_PULL_SECRET", type: "s", required: false, sample: "dockerlogin", default: "dockerlogin" }
- { name: "CENTREMCP_K8S_CA_FILE", alias: "CENTREMCP_K8S_CA_FILE", type: "s", required: false, sample: "", default: "" }
- { name: "CENTREMCP_K8S_ENDPOINT", alias: "CENTREMCP_K8S_ENDPOINT", type: "s", required: false, sample: "https://kubernetes.default.svc", default: "" }
- { name: "CENTREMCP_K8S_NAMESPACE", alias: "CENTREMCP_K8S_NAMESPACE", type: "s", required: false, sample: "boodabest", default: "" }
- { name: "CENTREMCP_K8S_TOKEN", alias: "CENTREMCP_K8S_TOKEN", type: "s", required: false, sample: "", default: "" }
- { name: "CENTREMCP_K8S_NODE_SELECTORS", alias: "CENTREMCP_K8S_NODE_SELECTORS", type: "s", required: false, sample: "{\"role\":\"worker\"}", default: "{}" }
